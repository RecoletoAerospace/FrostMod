@PART[FM_*]:NEEDS[SolSystem,!RealSolarSystem]:BEFORE[FrostMod]
{
    %SystemScale = #$@Sol_Configuration/SystemScale$
}

@PART[FM_*]:NEEDS[RealSolarSystem,!SolSystem]:BEFORE[FrostMod]
{
    %SystemScale = Real
}

@PART[FM_*]:FINAL
{
	!SystemScale = delete
}

@PART[FM_*]:HAS[#SystemScale[?eal]]:FOR[FrostMod]
{
	@rescaleFactor = 1
}

